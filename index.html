<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kiosk">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<title>Kiosk</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0B0C0F;color:#F2F2F0;overflow:hidden;
  font-family:'Inter','Hiragino Sans','Hiragino Kaku Gothic ProN',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:100%}
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Inter',sans-serif}
.in{font-family:'Inter','Hiragino Sans',sans-serif}
.tab{font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
.muted{color:#9A9DA6}
.fx{display:-webkit-box;display:-webkit-flex;display:flex}
.col{-webkit-flex-direction:column;flex-direction:column}
.between{-webkit-justify-content:space-between;justify-content:space-between}
.center{-webkit-justify-content:center;justify-content:center}
.aic{-webkit-align-items:center;align-items:center}
.aie{-webkit-align-items:flex-end;align-items:flex-end}
.ais{-webkit-align-items:flex-start;align-items:flex-start}
.aib{-webkit-align-items:baseline;align-items:baseline}
.grow{-webkit-flex:1;flex:1;min-height:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 1194×834 の固定ステージを画面に合わせて拡大縮小 */
#stage{position:absolute;left:0;top:0;width:1194px;height:834px;
  -webkit-transform-origin:0 0;transform-origin:0 0}
#stage.ready{-webkit-transition:-webkit-transform 3s;transition:transform 3s}
.card{position:absolute;background:#16181D;border:1px solid #22252C;border-radius:32px;box-sizing:border-box;overflow:hidden;
  display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#c-clock{left:32px;top:32px;width:747px;height:400px;padding:36px 44px;-webkit-justify-content:space-between;justify-content:space-between}
#c-weather{left:415.5px;top:452px;width:363px;height:350px;padding:28px;-webkit-justify-content:space-between;justify-content:space-between}
#c-cal{left:32px;top:452px;width:363px;height:350px;padding:24px 24px 20px}
#c-music{left:799px;top:32px;width:363px;height:474px;padding:12px}
#c-week{left:799px;top:526px;width:363px;height:276px;padding:22px 24px}
#c-ctrl{display:none;left:799px;top:428px;width:363px;height:150px;padding:16px 24px;-webkit-justify-content:space-between;justify-content:space-between}
.sp #c-music{height:376px}
.sp #c-ctrl{display:-webkit-box;display:-webkit-flex;display:flex}
.sp #c-week{top:598px;height:204px;padding:16px 24px}
.sp #week{margin-top:6px!important}
.sp .wrow{height:34px}
.sp .wrow:nth-child(n+5){display:none}
#c-ctrl.off .mb,#c-ctrl.off #m-seek{opacity:.35}

/* 時計 */
.cap{font-size:15px;font-weight:500;letter-spacing:.08em}
#time{font-size:200px;line-height:.85;font-weight:200;letter-spacing:-.04em}
#sec{font-size:44px;font-weight:300;padding-bottom:6px;margin-left:16px}
#date{font-size:34px;font-weight:500}
#weekday{font-size:24px;font-weight:400;margin-left:16px}
#holiday{font-size:20px;font-weight:500;margin-left:16px}

/* 天気 */
#wplace{font-size:17px;font-weight:500}
#wdesc{font-size:14px;margin-top:4px}
#wtemp{font-size:96px;font-weight:200;line-height:.9;letter-spacing:-.03em}
.wmeta{font-size:14px;text-align:right;line-height:1.6}
#hourly{border-top:1px solid #22252C;padding-top:18px}
#hourly>div{-webkit-flex:1;flex:1;text-align:center}
#hourly .h{font-size:13px;display:block}
#hourly svg{display:block;margin:8px auto}
#hourly .t{font-size:15px}

/* カレンダー */
.head{font-size:18px;font-weight:500}
.small{font-size:13px;font-weight:500}
.wk{margin-top:14px;font-size:12px}
.wk span,.crow div{width:14.2857%;text-align:center}
#cal{margin-top:10px}
.crow div{height:36px;line-height:36px;font-size:15px;color:#D8D9DC}
.crow .sun{color:#E59A8C}
.crow .today span{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%;color:#0B0C0F;font-weight:600}

.hint{font-size:14px;line-height:1.7;color:#9A9DA6}

/* 週間予報 */
.wrow{height:38px;border-top:1px solid #22252C}
.wrow:first-child{border-top:0}
.wrow .wd{width:72px;font-size:15px}
.wrow .wi{width:36px}
.wrow .wi svg{display:block}
.wrow .wp{font-size:13px;color:#6FA8FF;width:52px}
.wrow .lo,.wrow .hi{width:44px;text-align:right;font-size:15px}

/* ミュージック */
#c-music iframe{width:100%;height:100%;border:0;border-radius:22px;background:transparent}
.art{width:112px;height:112px;border-radius:18px;background:#2A2D35;-webkit-flex-shrink:0;flex-shrink:0;overflow:hidden}
.bar{height:4px;border-radius:2px;background:#2A2D35;overflow:hidden}
#m-fill{height:4px;width:0;background:#F2F2F0}
#m-seek{padding:8px 0;margin-top:-8px}
.mb{width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:#F2F2F0;padding:0;margin:0 9px;cursor:pointer}
.mb svg{display:block;margin:0 auto}
.mb.play{width:64px;height:64px;background:#F2F2F0;color:#0B0C0F}
.mb:active{opacity:.6}

/* 夜間減光・設定 */
#dim{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;-webkit-transition:opacity 2s;transition:opacity 2s;z-index:5}
body.night #dim{opacity:.78}
#gear{position:fixed;right:10px;bottom:6px;width:44px;height:44px;border:0;background:transparent;color:#9A9DA6;opacity:.35;z-index:6;padding:0}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal .box{background:#16181D;border:1px solid #22252C;max-width:640px;margin:30px auto;border-radius:24px;padding:24px 28px}
#modal h2{margin:0 0 8px;font-weight:500;font-size:20px}
#modal label{display:block;font-size:13px;color:#9A9DA6;margin:14px 0 6px}
#modal input{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid #2A2D35;background:#0B0C0F;color:#F2F2F0;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
#modal .row>div{-webkit-flex:1;flex:1;margin-right:10px}#modal .row>div:last-child{margin-right:0}
#modal button{font-size:16px;padding:11px 20px;border-radius:14px;border:0;margin:20px 8px 0 0;background:#2A2D35;color:#F2F2F0}
#modal button.primary{background:#FF9F45;color:#0B0C0F;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <!-- 時計 -->
  <section class="card" id="c-clock">
    <div class="fx between aic muted"><span class="cap" id="clabel">TOKYO</span><span class="cap" id="year" style="letter-spacing:0"></span></div>
    <div class="fx aie"><span id="time" class="tab">--:--</span><span id="sec" class="tab"></span></div>
    <div class="fx aib jp"><span id="date"></span><span id="weekday" class="muted"></span><span id="holiday"></span></div>
  </section>

  <!-- 天気 -->
  <section class="card jp" id="c-weather">
    <div class="fx between ais">
      <div><div id="wplace">天気</div><div id="wdesc" class="muted">読み込み中</div></div>
      <div id="wicon"></div>
    </div>
    <div class="fx between aie">
      <span id="wtemp" class="in">--°</span>
      <div class="wmeta muted"><div id="whl"></div><div id="whw"></div></div>
    </div>
    <div class="fx" id="hourly"></div>
  </section>

  <!-- カレンダー -->
  <section class="card jp" id="c-cal">
    <div class="fx between aib"><span class="head" id="month"></span><span class="small acc-c">今日</span></div>
    <div class="fx wk muted"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div id="cal" class="in grow fx col between"></div>
  </section>

  <!-- 再生操作（Spotifyのときだけ表示） -->
  <section class="card off" id="c-ctrl">
    <div>
      <div id="m-seek"><div class="bar"><div id="m-fill"></div></div></div>
      <div class="fx between muted in tab" style="font-size:12px;margin-top:6px"><span id="m-cur">0:00</span><span id="m-rem">-0:00</span></div>
    </div>
    <div class="fx aic center">
      <button class="mb" id="m-restart" aria-label="曲の頭に戻る"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="2.2" height="14" rx="1"></rect><path d="M20 5v14L8.5 12z"></path></svg></button>
      <button class="mb" id="m-back" aria-label="15秒戻す"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3 3.5V8h4.5"></path><text x="12.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="currentColor" stroke="none" font-family="Inter,sans-serif">15</text></svg></button>
      <button class="mb play" id="m-play" aria-label="再生"></button>
      <button class="mb" id="m-fwd" aria-label="15秒送る"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"></path><path d="M21 3.5V8h-4.5"></path><text x="11.5" y="15" text-anchor="middle" font-size="7.5" font-weight="600" fill="currentColor" stroke="none" font-family="Inter,sans-serif">15</text></svg></button>
    </div>
  </section>

  <!-- 週間予報 -->
  <section class="card jp" id="c-week">
    <div class="head">週間予報</div>
    <div id="week" style="margin-top:10px"></div>
  </section>

  <!-- ミュージック -->
  <section class="card jp" id="c-music"></section>
</div>

<div id="dim"></div>
<button id="gear" aria-label="設定"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>

<div id="modal"><div class="box jp">
  <h2>設定</h2>
  <div class="fx row">
    <div><label for="s_clockLabel">時計の見出し</label><input id="s_clockLabel"></div>
    <div><label for="s_accent">アクセント色</label><input id="s_accent" placeholder="#FF9F45"></div>
  </div>
  <div class="fx row">
    <div><label for="s_place">地名（天気の見出し）</label><input id="s_place"></div>
    <div><label for="s_lat">緯度</label><input id="s_lat" inputmode="decimal"></div>
    <div><label for="s_lon">経度</label><input id="s_lon" inputmode="decimal"></div>
  </div>
  <button id="s_geo">現在地を使う</button>
  <label for="s_music">Apple Music または Spotify の共有URL（プレイリスト・アルバムなど）</label>
  <input id="s_music" placeholder="https://music.apple.com/... または https://open.spotify.com/...">
  <div class="fx row">
    <div><label for="s_nightStart">夜間減光 開始(時)</label><input id="s_nightStart" inputmode="numeric"></div>
    <div><label for="s_nightEnd">夜間減光 終了(時)</label><input id="s_nightEnd" inputmode="numeric"></div>
    <div><label for="s_reloadHours">自動リロード(時間)</label><input id="s_reloadHours" inputmode="numeric"></div>
  </div>
  <button class="primary" id="s_save">保存して再読み込み</button><button id="s_close">閉じる</button>
</div></div>

<script>
(function () {
  'use strict';
  var W = 1194, H = 834;
  var DEFAULTS = { clockLabel: 'TOKYO', accent: '#FF9F45', place: '東京都', lat: 35.6812, lon: 139.7671,
                   music: '', nightStart: 23, nightEnd: 6, reloadHours: 6 };
  var KEY = 'kioskCfg';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var cfg = loadCfg();
  var ACC = /^#[0-9a-f]{3,8}$/i.test(cfg.accent) ? cfg.accent : DEFAULTS.accent;
  var holidays = {}, lastDay = -1, wakeUntil = 0, jx = 0, jy = 0;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function loadCfg() {
    var c = {}, s = null, k;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    for (k in DEFAULTS) c[k] = (s && s.hasOwnProperty(k) && s[k] !== '') ? s[k] : DEFAULTS[k];
    if (s && s.hasOwnProperty('music')) c.music = s.music;
    return c;
  }

  function get(url, cb) {
    var done = false, x = new XMLHttpRequest();
    function fin(err, txt) { if (done) return; done = true; cb(err, txt); }
    try {
      x.open('GET', url, true);
      x.timeout = 20000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        if (x.status >= 200 && x.status < 300) fin(null, x.responseText);
        else fin(new Error('HTTP ' + x.status));
      };
      x.ontimeout = function () { fin(new Error('timeout')); };
      x.send();
    } catch (e) { fin(e); }
  }

  /* ---------- 画面に合わせて拡大縮小 ---------- */
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, s = Math.min(w / W, h / H);
    var t = 'translate(' + ((w - W * s) / 2 + jx) + 'px,' + ((h - H * s) / 2 + jy) + 'px) scale(' + s + ')';
    $('stage').style.webkitTransform = t; $('stage').style.transform = t;
  }

  /* ---------- アイコン（線画SVG） ---------- */
  var WHITE = '#F2F2F0', GREY = '#9A9DA6', BLUE = '#6FA8FF';
  function svg(size, sw, body) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke-width="' + sw +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }
  var CLOUD = 'M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.6A3.2 3.2 0 0 0 7 18z';
  var CLOUD_HI = 'M7 15h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.6A3.2 3.2 0 0 0 7 15z';
  function icon(code, day, size) {
    var sw = size > 30 ? 1.5 : 1.6;
    if (code <= 1) {
      if (!day) return svg(size, sw, '<path stroke="' + GREY + '" d="M18 14.5A7 7 0 0 1 9.5 6a7 7 0 1 0 8.5 8.5z"></path>');
      return svg(size, sw, '<g stroke="' + ACC + '"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></g>');
    }
    if (code === 2) {
      if (!day) return svg(size, sw, '<path stroke="' + GREY + '" d="M14 4.5A5 5 0 0 0 19.5 10"></path><path stroke="' + WHITE + '" d="' + CLOUD + '"></path>');
      return svg(size, sw, '<g stroke="' + ACC + '"><circle cx="9" cy="9" r="3.5"></circle><path d="M9 2v1.5M9 14.5V16M2 9h1.5M3.9 3.9l1 1M13.1 4.9l1-1M3.9 14.1l1-1"></path></g><path stroke="' + WHITE + '" d="M10.5 20h7a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.3 1.8A2.6 2.6 0 0 0 10.5 20z"></path>');
    }
    if (code === 3) return svg(size, sw, '<path stroke="' + WHITE + '" d="' + CLOUD + '"></path>');
    if (code === 45 || code === 48) return svg(size, sw, '<path stroke="' + GREY + '" d="M4 9h16M3 13h18M5 17h14"></path>');
    if ((code >= 71 && code <= 77) || code === 85 || code === 86)
      return svg(size, sw, '<path stroke="' + WHITE + '" d="' + CLOUD_HI + '"></path><path stroke="' + BLUE + '" d="M8 19v.01M12 20v.01M16 19v.01M10 22v.01M14 22v.01" stroke-width="2.4"></path>');
    if (code >= 95) return svg(size, sw, '<path stroke="' + WHITE + '" d="' + CLOUD_HI + '"></path><path stroke="' + ACC + '" d="M12.5 16l-2 3.5h3l-2 3.5"></path>');
    // 霧雨・雨・にわか雨
    return svg(size, sw, '<path stroke="' + WHITE + '" d="' + CLOUD_HI + '"></path><path stroke="' + BLUE + '" d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path>');
  }
  var LABEL = { 0: '快晴', 1: '晴れ', 2: '晴れ時々くもり', 3: 'くもり', 45: '霧', 48: '霧', 51: '霧雨', 53: '霧雨', 55: '強い霧雨',
    56: '着氷性の霧雨', 57: '着氷性の霧雨', 61: '小雨', 63: '雨', 65: '大雨', 66: '着氷性の雨', 67: '着氷性の雨',
    71: '小雪', 73: '雪', 75: '大雪', 77: '霧雪', 80: 'にわか雨', 81: 'にわか雨', 82: '激しいにわか雨',
    85: 'にわか雪', 86: '強いにわか雪', 95: '雷雨', 96: 'ひょうを伴う雷雨', 99: 'ひょうを伴う雷雨' };

  /* ---------- 時計 ---------- */
  function tick() {
    var d = new Date();
    $('time').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('sec').innerHTML = pad(d.getSeconds());
    if (d.getDate() !== lastDay) {
      lastDay = d.getDate();
      $('year').innerHTML = d.getFullYear() + '年';
      $('date').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日';
      $('weekday').innerHTML = WD[d.getDay()] + '曜日';
      renderCal(d);
    }
    night(d);
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }

  function night(d) {
    var h = d.getHours(), s = +cfg.nightStart, e = +cfg.nightEnd;
    var isNight = s === e ? false : (s < e ? (h >= s && h < e) : (h >= s || h < e));
    if (Date.now() < wakeUntil) isNight = false;
    document.body.className = isNight ? 'night' : '';
  }

  /* ---------- 天気（Open-Meteo, APIキー不要） ---------- */
  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon +
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day' +
      '&hourly=temperature_2m,weather_code,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=auto&forecast_days=6&wind_speed_unit=ms';
    get(url, function (err, txt) {
      if (err) { $('wdesc').innerHTML = '天気を取得できません'; return; }
      var j; try { j = JSON.parse(txt); } catch (e) { return; }
      var c = j.current, hr = j.hourly, dl = j.daily;
      $('wplace').innerHTML = esc(cfg.place);
      $('wdesc').innerHTML = LABEL[c.weather_code] || '—';
      $('wicon').innerHTML = icon(c.weather_code, c.is_day, 56);
      $('wtemp').innerHTML = Math.round(c.temperature_2m) + '°';
      $('whl').innerHTML = '最高 ' + Math.round(dl.temperature_2m_max[0]) + '° / 最低 ' + Math.round(dl.temperature_2m_min[0]) + '°';
      $('whw').innerHTML = '湿度 ' + c.relative_humidity_2m + '% · 風 ' + Math.round(c.wind_speed_10m) + 'm/s';
      // 現在の時刻の次から4時間ぶん
      var now = String(c.time).slice(0, 13), idx = 0;
      for (var i = 0; i < hr.time.length; i++) if (hr.time[i].slice(0, 13) === now) { idx = i; break; }
      var h = '<div><span class="h muted">今</span>' + icon(c.weather_code, c.is_day, 24) +
        '<span class="t in">' + Math.round(c.temperature_2m) + '°</span></div>';
      for (var k = idx + 1; k <= idx + 4 && k < hr.time.length; k++) {
        h += '<div><span class="h muted">' + (+hr.time[k].slice(11, 13)) + '時</span>' + icon(hr.weather_code[k], hr.is_day[k], 24) +
          '<span class="t in">' + Math.round(hr.temperature_2m[k]) + '°</span></div>';
      }
      $('hourly').innerHTML = h;
      // 週間予報（明日から5日）
      var w = '';
      for (var q = 1; q < dl.time.length && q <= 5; q++) {
        var dp = dl.time[q].split('-'), dd = new Date(+dp[0], +dp[1] - 1, +dp[2]);
        var pr = dl.precipitation_probability_max ? dl.precipitation_probability_max[q] : null;
        w += '<div class="fx aic wrow"><span class="wd">' + (q === 1 ? '明日' : WD[dd.getDay()] + '曜日') + '</span>' +
          '<span class="wi">' + icon(dl.weather_code[q], 1, 24) + '</span>' +
          '<span class="wp in">' + (pr == null ? '' : pr + '%') + '</span><span class="grow"></span>' +
          '<span class="lo in muted">' + Math.round(dl.temperature_2m_min[q]) + '°</span>' +
          '<span class="hi in">' + Math.round(dl.temperature_2m_max[q]) + '°</span></div>';
      }
      $('week').innerHTML = w;
    });
  }

  /* ---------- 祝日（holidays-jp） ---------- */
  function loadHolidays() {
    get('https://holidays-jp.github.io/api/v1/date.json', function (err, txt) {
      if (err) return;
      try { holidays = JSON.parse(txt); } catch (e) { return; }
      renderCal(new Date());
    });
  }

  /* ---------- 月カレンダー ---------- */
  function renderCal(now) {
    var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    $('month').innerHTML = y + '年' + (m + 1) + '月';
    var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    var total = Math.ceil((first + days) / 7) * 7, h = '';
    for (var i = 0; i < total; i++) {
      if (i % 7 === 0) h += '<div class="fx crow">';
      var n = i - first + 1, inM = n >= 1 && n <= days, cls = '';
      if (inM) {
        var key = y + '-' + pad(m + 1) + '-' + pad(n);
        if (i % 7 === 0 || holidays[key]) cls = 'sun';
        if (n === d) cls = 'today';
      }
      h += '<div class="' + cls + '">' + (inM ? (n === d ? '<span style="background:' + ACC + '">' + n + '</span>' : n) : '') + '</div>';
      if (i % 7 === 6) h += '</div>';
    }
    $('cal').innerHTML = h;
    var hol = holidays[ymd(now)];
    $('holiday').innerHTML = hol ? esc(hol) : '';
  }

  /* ---------- ミュージック（Apple Music / Spotify の埋め込み） ---------- */
  var I_PLAY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>';
  var I_PAUSE = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
  var sp = null, spSt = { paused: true, pos: 0, dur: 0 };

  // Spotify の共有URL → spotify:playlist:ID など
  function parseSpotify(u) {
    var m = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album|track|episode|show|artist)\/([A-Za-z0-9]+)/i.exec(u || '');
    return m ? 'spotify:' + m[1].toLowerCase() + ':' + m[2] : null;
  }
  function mmss(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + pad(t % 60); }

  function spUpdate() {
    $('m-play').innerHTML = spSt.paused ? I_PLAY : I_PAUSE;
    $('m-play').setAttribute('aria-label', spSt.paused ? '再生' : '一時停止');
    $('m-fill').style.width = (spSt.dur ? Math.min(100, spSt.pos / spSt.dur * 100) : 0) + '%';
    $('m-cur').innerHTML = mmss(spSt.pos);
    $('m-rem').innerHTML = '-' + mmss(spSt.dur - spSt.pos);
    $('c-ctrl').className = 'card' + (sp ? '' : ' off');
  }
  function spSeek(t) { if (sp && spSt.dur) { spSt.pos = Math.max(0, Math.min(spSt.dur - 1, t)); sp.seek(spSt.pos); spUpdate(); } }

  function renderSpotify(uri) {
    var box = $('c-music');
    box.style.padding = '12px';
    box.innerHTML = '<div id="sp-embed"></div>';
    $('m-play').onclick = function () { if (sp) sp.togglePlay(); };
    $('m-restart').onclick = function () { if (sp) sp.restart(); };
    $('m-back').onclick = function () { spSeek(spSt.pos - 15); };
    $('m-fwd').onclick = function () { spSeek(spSt.pos + 15); };
    $('m-seek').onclick = function (e) {
      var r = this.getBoundingClientRect();
      if (r.width) spSeek((e.clientX - r.left) / r.width * spSt.dur);
    };
    spUpdate();
    window.onSpotifyIframeApiReady = function (API) {
      API.createController($('sp-embed'), { uri: uri, width: '100%', height: 352 }, function (c) {
        sp = c;
        c.addListener('playback_update', function (e) {
          var d = (e && e.data) || {};
          spSt.paused = !!d.isPaused; spSt.pos = (d.position || 0) / 1000; spSt.dur = (d.duration || 0) / 1000;
          spUpdate();
        });
        spUpdate();
      });
    };
    var s = document.createElement('script');
    s.src = 'https://open.spotify.com/embed/iframe-api/v1';
    s.async = true;
    s.onerror = function () { box.innerHTML = '<div class="hint" style="padding:12px">Spotifyのプレーヤーを読み込めませんでした。</div>'; };
    document.head.appendChild(s);
  }

  function renderMusic() {
    var box = $('c-music'), uri = parseSpotify(cfg.music);
    document.documentElement.className = uri ? 'sp' : '';
    if (uri) { renderSpotify(uri); return; }
    if (!cfg.music) {
      box.style.padding = '24px';
      box.innerHTML = '<div class="fx aic"><div class="art fx aic center">' +
        svg(40, 1.5, '<g stroke="' + GREY + '"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></g>') +
        '</div><div style="margin-left:16px;min-width:0"><div class="small" style="letter-spacing:.06em;color:' + ACC + '">MUSIC</div>' +
        '<div style="font-size:19px;font-weight:500;margin-top:6px">未設定</div></div></div>' +
        '<div class="hint" style="margin-top:24px">右下の歯車から、Apple Music か Spotify のプレイリストやアルバムの共有URLを登録すると、ここにプレーヤーが表示されます。</div>';
      return;
    }
    box.style.padding = '12px';
    var u = String(cfg.music).replace('://music.apple.com', '://embed.music.apple.com');
    u += (u.indexOf('?') < 0 ? '?' : '&') + 'theme=dark';
    box.innerHTML = '<iframe title="Apple Music" allow="autoplay *; encrypted-media *; fullscreen *" ' +
      'sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="' + esc(u) + '"></iframe>';
  }

  /* ---------- 設定画面 ---------- */
  var FIELDS = ['clockLabel', 'accent', 'place', 'lat', 'lon', 'music', 'nightStart', 'nightEnd', 'reloadHours'];
  $('gear').onclick = function () {
    for (var i = 0; i < FIELDS.length; i++) $('s_' + FIELDS[i]).value = cfg[FIELDS[i]];
    $('modal').style.display = 'block';
  };
  $('s_close').onclick = function () { $('modal').style.display = 'none'; };
  $('s_save').onclick = function () {
    var c = {};
    for (var i = 0; i < FIELDS.length; i++) c[FIELDS[i]] = $('s_' + FIELDS[i]).value.replace(/^\s+|\s+$/g, '');
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) { alert('保存できませんでした'); }
    location.reload();
  };
  $('s_geo').onclick = function () {
    if (!navigator.geolocation) return alert('位置情報が使えません');
    navigator.geolocation.getCurrentPosition(function (p) {
      $('s_lat').value = p.coords.latitude.toFixed(4); $('s_lon').value = p.coords.longitude.toFixed(4);
    }, function () { alert('位置情報を取得できませんでした（HTTPSが必要です）'); });
  };

  // 夜間はタップで1分間だけ明るく
  document.addEventListener('touchstart', function () { if (document.body.className === 'night') { wakeUntil = Date.now() + 60000; night(new Date()); } }, false);
  // 画面のバウンス・スクロール防止（設定画面は除く）
  document.addEventListener('touchmove', function (e) {
    var n = e.target; while (n) { if (n.id === 'modal') return; n = n.parentNode; }
    e.preventDefault();
  }, { passive: false });

  /* ---------- 起動 ---------- */
  $('clabel').innerHTML = esc(cfg.clockLabel);
  var accEls = document.querySelectorAll('.acc-c');
  for (var a = 0; a < accEls.length; a++) accEls[a].style.color = ACC;
  $('sec').style.color = ACC;
  $('holiday').style.color = ACC;

  fit();
  setTimeout(function () { $('stage').className = 'ready'; }, 50);
  window.addEventListener('resize', fit, false);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); }, false);

  tick();
  loadWeather(); setInterval(loadWeather, 15 * 60e3);
  loadHolidays(); setInterval(loadHolidays, 24 * 3600e3);
  renderMusic();
  // 焼き付き防止：3分ごとに数pxずらす
  setInterval(function () { jx = Math.round(Math.random() * 8 - 4); jy = Math.round(Math.random() * 8 - 4); fit(); }, 3 * 60e3);
  var rh = +cfg.reloadHours;
  if (rh > 0) setTimeout(function () { location.reload(); }, rh * 3600e3);
})();
</script>
</body>
</html>
